<input type="file" id="file">

<button id="upload">
    Загрузить
</button>

<script>

const url =
"https://ТВОЯ_ССЫЛКА_ФУНКЦИИ";

document
.getElementById("upload")
.onclick = async ()=>{

    const file =
    document
    .getElementById("file")
    .files[0];

    const form =
    new FormData();

    form.append(
        "file",
        file
    );

    form.append(
        "folder",
        "photos/originals"
    );

    const response =
    await fetch(
        url,
        {
            method:"POST",
            body:form
        }
    );

    console.log(
        await response.json()
    );

};

</script>
